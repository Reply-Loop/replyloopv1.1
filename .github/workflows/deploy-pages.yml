# Deploy to Cloudflare Pages on every push.
#
# - A push to `main` (the Pages project's production branch) deploys to
#   production: https://reply-loop-staging.pages.dev
# - A push to any other branch deploys a preview at
#   https://<branch>.reply-loop-staging.pages.dev (slashes become dashes),
#   so work in progress never replaces production.
# - The deploy only runs if `npm run build:static` passes, and that includes
#   the compliance scan over the exported pages.
#
# One-time setup in GitHub (Settings > Secrets and variables > Actions):
# - secret   CLOUDFLARE_API_TOKEN: a Cloudflare API token with
#            Account > Cloudflare Pages > Edit
# - CLOUDFLARE_ACCOUNT_ID: the Cloudflare account ID, as a secret or a variable
#   (it is not a credential; a secret just keeps it out of logs)
# Until the token exists, the build still runs and the deploy step is skipped
# with a warning.
name: Deploy to Cloudflare Pages

on:
  push:
    branches: ["**"]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

env:
  PAGES_PROJECT: reply-loop-staging

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site (includes the compliance scan)
        run: npm run build:static

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
          BRANCH: ${{ github.ref_name }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::Deploy skipped: set the CLOUDFLARE_API_TOKEN secret and CLOUDFLARE_ACCOUNT_ID (secret or variable)."
            exit 0
          fi
          # First line of the commit message only, capped: Pages rejects long messages.
          MESSAGE="$(printf '%s' "${COMMIT_MESSAGE:-manual deploy}" | head -n 1 | cut -c 1-300)"
          npx wrangler pages deploy out \
            --project-name="$PAGES_PROJECT" \
            --branch="$BRANCH" \
            --commit-hash="$GITHUB_SHA" \
            --commit-message="$MESSAGE" \
            | tee "$RUNNER_TEMP/deploy.log"
          URL="$(grep -Eo 'https://[a-zA-Z0-9.-]+\.pages\.dev' "$RUNNER_TEMP/deploy.log" | tail -n 1 || true)"
          {
            echo "### Cloudflare Pages"
            echo ""
            echo "Branch: \`$BRANCH\`"
            echo ""
            echo "Deployment: ${URL:-see the log above}"
          } >> "$GITHUB_STEP_SUMMARY"
